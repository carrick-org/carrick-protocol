name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Suite runs on the standard library alone
        run: |
          python -m unittest discover -s tests
          python conformance/lodestone_conformance.py repo examples/memory-repo
      - name: Schemas and examples
        run: |
          pip install jsonschema
          python -m unittest discover -s tests -v
      - name: JSON files are valid
        run: for f in $(git ls-files '*.json'); do python -m json.tool "$f" > /dev/null || exit 1; done
